services:
  postgres_db:
    image: pgvector/pgvector:pg16
    container_name: postgres_desaparecidos
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mi_password_seguro
      POSTGRES_DB: db_desaparecidos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: